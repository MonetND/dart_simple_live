name: build-apk-no-secrets

on:
  workflow_dispatch: # 允许手动触发,无需配置任何仓库 secrets

jobs:
  build-android:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      # 签出代码
      - uses: actions/checkout@v6

      # 设置 JAVA 环境
      - uses: actions/setup-java@v5
        with:
          distribution: "zulu"
          java-version: "17"
          cache: "gradle"
          cache-dependency-path: |
            simple_live_app/android/*.gradle*
            simple_live_app/android/**/gradle-wrapper.properties

      # 设置 Flutter(版本读取 simple_live_app/pubspec.yaml 中的 flutter: 字段)
      - name: Flutter action
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: simple_live_app/pubspec.yaml
          cache: true

      # 更新 Flutter 的 packages(仓库自带 pubspec.lock / google-services.json / firebase_options.dart)
      - name: Restore packages
        run: |
          cd simple_live_app
          flutter pub get

      # 打包 APK(无 key.properties 时自动使用 debug 签名)
      - name: Build APK
        run: |
          cd simple_live_app
          flutter build apk --release --split-per-abi

      # 上传 APK 至 Artifacts(构建完成后到 Actions 页面下载)
      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: |
            simple_live_app/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            simple_live_app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            simple_live_app/build/app/outputs/flutter-apk/app-x86_64-release.apk
